name: Build Windows download

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: write

concurrency:
  group: windows-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate EQ and original SDK
        run: npm test
      - name: Package Windows app with original SDK
        run: npm run package:folder
      - name: Create complete application ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'release/win-unpacked/resources/app.asar')) { throw 'App package is missing' }
          Copy-Item 'README_먼저읽기.txt' 'release/win-unpacked/README_먼저읽기.txt'
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath 'AZLA-Equalizer-Windows.zip'
          $digest = (Get-FileHash 'AZLA-Equalizer-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  AZLA-Equalizer-Windows.zip" | Set-Content -Encoding utf8 'SHA256SUMS.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AZLA-Equalizer-Windows
          path: |
            AZLA-Equalizer-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish preview download
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" 'AZLA-Equalizer-Windows.zip' 'SHA256SUMS.txt' --repo "$env:GITHUB_REPOSITORY" --verify-tag --prerelease --title "AZLA Equalizer $env:RELEASE_TAG" --notes-file 'docs/release-notes.md'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
